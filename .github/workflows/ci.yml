name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The same gate as .githooks/pre-push, here so `git push --no-verify` cannot
  # skip it. Its own job, not a matrix step: the audit reads package-lock.json
  # and does not depend on the Node version, so it needs no install.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Fail on any npm advisory
        run: npm audit

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Guard against committed licensed X12 data
        run: npm run check:licensed-data
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
