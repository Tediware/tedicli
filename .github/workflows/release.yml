name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      # Full history, not the default depth-1 checkout: scripts/release-notes.mjs
      # builds the changelog from the commits between the previous tag and this
      # one, and a shallow clone holds neither the previous tag nor those commits.
      # It sees only the version-bump commit, discards it as noise, and aborts on
      # an empty changelog.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Pinned to a major line
      # (like node-version above) rather than @latest: npm 12 landed mid-release
      # and changed `npm pack --json`'s output shape, failing the preflight on a
      # build that was fine. Bump this deliberately, not by surprise.
      - run: npm install -g npm@12

      - run: npm ci

      - name: Guard against committed licensed X12 data
        run: npm run check:licensed-data

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify publishable tarball
        run: node scripts/release-preflight.mjs

      # Create the GitHub Release first (idempotently). It is the source of
      # `tedi update`'s changelog, and doing it before publish keeps a failed
      # publish safely re-runnable instead of orphaning npm/Release state.
      # Notes come from the commit log, not --generate-notes: that builds its list
      # from merged PRs, and this repo commits straight to main, so every release
      # body was a bare "Full Changelog" link — which is what `tedi update` shows
      # users under "What's new".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving its notes alone."
          else
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
          fi

      # No NODE_AUTH_TOKEN: authentication is handled by OIDC trusted publishing.
      # access:public comes from publishConfig; --provenance is requested explicitly
      # (it must NOT be forced via publishConfig, which would break local publishes).
      - name: Publish to npm
        run: npm publish --provenance --access public
